[workspace]
members = ["sdk/plugin-sdk", "example-echo/service", "sdk/plugin-bench"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

[workspace.dependencies]
kernel-protocol = { path = "../backend/crates/kernel-protocol" }
plugin-sdk = { path = "sdk/plugin-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-util", "net", "rt", "macros", "sync", "time", "signal", "process"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
large_enum_variant = { level = "warn", priority = 8 }
needless_collect = { level = "deny", priority = 7 }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
