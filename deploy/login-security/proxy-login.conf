# Install in /etc/fail2ban/jail.d/. Per-site overrides live in zz-proxy-login.local.
[proxy-api-login]
enabled = true
backend = systemd
filter = proxy-api-login
action = proxy-login[site=api]
ignoreip = 127.0.0.0/8 ::1
usedns = no
maxretry = 5
findtime = 600
bantime = 900
bantime.increment = true
bantime.factor = 1
bantime.maxtime = 86400

[proxy-panel-login]
enabled = true
backend = systemd
filter = proxy-panel-login
action = proxy-login[site=panel]
ignoreip = 127.0.0.0/8 ::1
usedns = no
maxretry = 5
findtime = 600
bantime = 900
bantime.increment = true
bantime.factor = 1
bantime.maxtime = 86400
