[Definition]
# Go %%q escapes username quotes and newlines; do not greedily match user-controlled text.
failregex = ^.*\bWARNING\s+-\s+failed login: username="(?:[^"\\]|\\.)*", IP="<HOST>", reason="(?:invalid credentials|invalid 2FA code)"(?:, blocked_until=[^\s]+)?\s*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=x-ui.service
