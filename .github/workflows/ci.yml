name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
  excel-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 与生产 Worker 的最低 Python 版本一致，防止默认 runner 版本掩盖兼容性问题。
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Test installed Worker in a clean environment
        run: python tools/test-excel-worker.py
      - name: Verify updater contracts
        run: python -m unittest discover -s services/updater -v
