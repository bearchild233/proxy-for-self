[Definition]
actionban = /usr/bin/python3 -I /opt/proxy-for-self-updater/login_security.py --database /var/lib/proxy-for-self-updater/login-bans.db ban <site> <ip> <bantime>
actionunban = /usr/bin/python3 -I /opt/proxy-for-self-updater/login_security.py --database /var/lib/proxy-for-self-updater/login-bans.db unban <site> <ip>
# Incremental bans may be prolonged without an additional actionban.
actionprolong = <actionban>

[Init]
site = api
