[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-for-self-excel-worker"
version = "0.1.0"
description = "Private Unix-socket Excel worker for proxy-for-self"
requires-python = ">=3.10"
license = {text = "Unlicense"}
dependencies = ["httpx[socks]>=0.27,<0.29", "starlette>=0.40,<2", "uvicorn>=0.30,<1", "zstandard>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
proxy-for-self-excel = "excel_codex_bridge.hub_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
