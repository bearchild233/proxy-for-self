name: Publish plugin
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin ID; builds only this package'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-release-${{ inputs.plugin }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PLUGIN_ID: ${{ inputs.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate ID and version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          name = os.environ['PLUGIN_ID']
          assert re.fullmatch(r'[a-z][a-z0-9-]{0,63}', name)
          manifest = json.loads(pathlib.Path('plugins', name, 'plugin.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+', manifest['version'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PLUGIN_TAG=plugin-' + name + '-v' + manifest['version'] + '\n')
          PY
      - name: Check and build selected plugin
        run: |
          pnpm --dir frontend install --frozen-lockfile
          node scripts/check-plugin.mjs "$PLUGIN_ID"
          node scripts/build-plugin.mjs "$PLUGIN_ID"
          node --test frontend/plugin-tests/component-packages.test.mjs
          python3 -m unittest discover -s services/plugin_host -v
          python3 -m unittest discover -s services/updater -p test_static_plugins.py -v
          python3 scripts/package-ui-plugin.py "$PLUGIN_ID"
      - name: Verify Excel Worker
        if: inputs.plugin == 'excel-bridge'
        run: python3 tools/test-excel-worker.py
      - name: Package Excel runtime
        if: inputs.plugin == 'excel-bridge'
        run: |
          python3 -m venv .build/excel-release/venv
          .build/excel-release/venv/bin/python -I -m pip --isolated install --no-deps -r plugins/excel-bridge/requirements.lock
          .build/excel-release/venv/bin/python -I -m pip check
          plugin_version="$(python3 -c 'import json; print(json.load(open("plugins/excel-bridge/plugin.json"))["version"])')"
          python3 services/updater/package_plugin.py --runtime .build/excel-release --source plugins/excel-bridge/src/excel_codex_bridge --output .build/plugin-releases/excel-runtime.tar.gz --version "$plugin_version"
          sha256sum .build/plugin-releases/excel-runtime.tar.gz > .build/plugin-releases/excel-runtime.tar.gz.sha256
      - name: Publish immutable plugin package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$PLUGIN_TAG" .build/plugin-releases/*.tar.gz .build/plugin-releases/*.sha256 \
            --target "$GITHUB_SHA" --title "$PLUGIN_ID $PLUGIN_TAG" --generate-notes --latest=false
